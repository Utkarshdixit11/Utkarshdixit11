<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#303036" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6A76A" />
      <stop offset="100%" stop-color="#E5CA92" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .serif { font-family: 'Cinzel', 'Didot', 'Playfair Display', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Card Surface -->
  <rect width="900" height="240" fill="url(#cardBg)" rx="6" />
  <rect width="900" height="240" fill="url(#cardGrid)" rx="6" />
  <rect x="0.5" y="0.5" width="899" height="239" fill="none" stroke="#303036" rx="6" />

  <!-- Top Accent Bar -->
  <line x1="0" y1="0" x2="180" y2="0" stroke="url(#goldAccent)" stroke-width="3" />

  <!-- Top Metadata Row -->
  <g transform="translate(32, 34)">
    <rect x="0" y="-12" width="110" height="20" fill="#1B1B22" rx="3" stroke="#303036" stroke-width="0.75" />
    <text x="55" y="2" text-anchor="middle" class="mono" font-size="9.5" fill="#C6A76A" letter-spacing="1.5">EXHIBIT // 03</text>

    <rect x="120" y="-12" width="130" height="20" fill="#1B1B22" rx="3" stroke="#303036" stroke-width="0.75" />
    <circle cx="132" cy="-2" r="3" fill="#10B981" />
    <text x="142" y="2" class="mono" font-size="9.5" fill="#F3EFE6" letter-spacing="1">RENDER DEPLOYED</text>

    <text x="836" y="2" text-anchor="end" class="mono" font-size="9.5" fill="#A1A1AA" letter-spacing="1">CATEGORY: FULL-STACK COMMERCE</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(32, 74)">
    <!-- Title -->
    <text x="0" y="22" class="serif" font-size="26" font-weight="600" fill="#F3EFE6" letter-spacing="1.5">ZINGBITE</text>
    <text x="150" y="19" class="sans" font-size="13" font-weight="300" fill="#C6A76A" letter-spacing="0.5">· 3-Tier Food Delivery Ecosystem &amp; Administration Suite</text>

    <!-- Description -->
    <text x="0" y="52" class="sans" font-size="12" fill="#A1A1AA" letter-spacing="0.2">
      Three-tier production architecture combining consumer storefront, restaurant management portal, and REST API.
    </text>
    <text x="0" y="72" class="sans" font-size="12" fill="#A1A1AA" letter-spacing="0.2">
      Features persistent database cart synchronization, Stripe hosted payments, and dynamic real-time order tracking.
    </text>

    <!-- Key Architectural Highlights (Pill Badges) -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="145" height="24" fill="#1B1B22" rx="3" stroke="#303036" stroke-width="0.75" />
      <text x="72" y="15" text-anchor="middle" class="mono" font-size="9.5" fill="#F3EFE6">Stripe Checkout API</text>

      <rect x="155" y="0" width="145" height="24" fill="#1B1B22" rx="3" stroke="#303036" stroke-width="0.75" />
      <text x="227" y="15" text-anchor="middle" class="mono" font-size="9.5" fill="#F3EFE6">Persistent Cart Sync</text>

      <rect x="310" y="0" width="145" height="24" fill="#1B1B22" rx="3" stroke="#303036" stroke-width="0.75" />
      <text x="382" y="15" text-anchor="middle" class="mono" font-size="9.5" fill="#F3EFE6">Restaurant Admin App</text>

      <rect x="465" y="0" width="125" height="24" fill="#1B1B22" rx="3" stroke="#303036" stroke-width="0.75" />
      <text x="527" y="15" text-anchor="middle" class="mono" font-size="9.5" fill="#F3EFE6">Multer File Pipeline</text>
    </g>
  </g>

  <!-- Bottom Technical Strip -->
  <line x1="32" y1="208" x2="868" y2="208" stroke="#303036" stroke-width="0.75" />
  <g transform="translate(32, 224)">
    <text x="0" y="0" class="mono" font-size="9" fill="#A1A1AA" letter-spacing="1">
      STACK: <tspan fill="#C6A76A">REACT 19</tspan> · <tspan fill="#C6A76A">REACT ROUTER V7</tspan> · <tspan fill="#C6A76A">EXPRESS 5</tspan> · <tspan fill="#C6A76A">STRIPE</tspan> · <tspan fill="#C6A76A">MONGODB</tspan>
    </text>
    <text x="836" y="0" text-anchor="end" class="mono" font-size="9" fill="#C6A76A" letter-spacing="1.5">
      FOOD-DEL-FRONTEND-ANQ3.ONRENDER.COM ↗
    </text>
  </g>
</svg>
