<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#303036" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6A76A" />
      <stop offset="100%" stop-color="#E5CA92" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .serif { font-family: 'Cinzel', 'Didot', 'Playfair Display', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Card Surface -->
  <rect width="900" height="240" fill="url(#cardBg)" rx="6" />
  <rect width="900" height="240" fill="url(#cardGrid)" rx="6" />
  <rect x="0.5" y="0.5" width="899" height="239" fill="none" stroke="#303036" rx="6" />

  <!-- Top Accent Bar -->
  <line x1="0" y1="0" x2="180" y2="0" stroke="url(#goldAccent)" stroke-width="3" />

  <!-- Top Metadata Row -->
  <g transform="translate(32, 34)">
    <rect x="0" y="-12" width="110" height="20" fill="#1B1B22" rx="3" stroke="#303036" stroke-width="0.75" />
    <text x="55" y="2" text-anchor="middle" class="mono" font-size="9.5" fill="#C6A76A" letter-spacing="1.5">EXHIBIT // 01</text>

    <rect x="120" y="-12" width="130" height="20" fill="#1B1B22" rx="3" stroke="#303036" stroke-width="0.75" />
    <circle cx="132" cy="-2" r="3" fill="#10B981" />
    <text x="142" y="2" class="mono" font-size="9.5" fill="#F3EFE6" letter-spacing="1">VERCEL DEPLOYED</text>

    <text x="836" y="2" text-anchor="end" class="mono" font-size="9.5" fill="#A1A1AA" letter-spacing="1">CATEGORY: COLLABORATIVE SYSTEMS</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(32, 74)">
    <!-- Title -->
    <text x="0" y="22" class="serif" font-size="26" font-weight="600" fill="#F3EFE6" letter-spacing="1.5">SLAYSHEET</text>
    <text x="180" y="19" class="sans" font-size="13" font-weight="300" fill="#C6A76A" letter-spacing="0.5">· Real-Time Multiplayer Document Workspace &amp; Gemini AI</text>

    <!-- Description -->
    <text x="0" y="52" class="sans" font-size="12" fill="#A1A1AA" letter-spacing="0.2">
      Engineered with Socket.IO for room-based user presence, concurrent remote cursors, and keystroke-level version time travel.
    </text>
    <text x="0" y="72" class="sans" font-size="12" fill="#A1A1AA" letter-spacing="0.2">
      Integrated with a contextual Google Gemini AI sidecar partner for summarization, tone enhancement, and outline synthesis.
    </text>

    <!-- Key Architectural Highlights (Pill Badges) -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="135" height="24" fill="#1B1B22" rx="3" stroke="#303036" stroke-width="0.75" />
      <text x="67" y="15" text-anchor="middle" class="mono" font-size="9.5" fill="#F3EFE6">Multiplayer Socket.IO</text>

      <rect x="145" y="0" width="145" height="24" fill="#1B1B22" rx="3" stroke="#303036" stroke-width="0.75" />
      <text x="217" y="15" text-anchor="middle" class="mono" font-size="9.5" fill="#F3EFE6">Keystroke Time Machine</text>

      <rect x="300" y="0" width="125" height="24" fill="#1B1B22" rx="3" stroke="#303036" stroke-width="0.75" />
      <text x="362" y="15" text-anchor="middle" class="mono" font-size="9.5" fill="#F3EFE6">Gemini AI Partner</text>

      <rect x="435" y="0" width="115" height="24" fill="#1B1B22" rx="3" stroke="#303036" stroke-width="0.75" />
      <text x="492" y="15" text-anchor="middle" class="mono" font-size="9.5" fill="#F3EFE6">Letter 96 DPI Canvas</text>
    </g>
  </g>

  <!-- Bottom Technical Strip -->
  <line x1="32" y1="208" x2="868" y2="208" stroke="#303036" stroke-width="0.75" />
  <g transform="translate(32, 224)">
    <text x="0" y="0" class="mono" font-size="9" fill="#A1A1AA" letter-spacing="1">
      STACK: <tspan fill="#C6A76A">REACT 19</tspan> · <tspan fill="#C6A76A">TIPTAP</tspan> · <tspan fill="#C6A76A">SOCKET.IO</tspan> · <tspan fill="#C6A76A">NODE.JS</tspan> · <tspan fill="#C6A76A">EXPRESS</tspan> · <tspan fill="#C6A76A">MONGODB</tspan>
    </text>
    <text x="836" y="0" text-anchor="end" class="mono" font-size="9" fill="#C6A76A" letter-spacing="1.5">
      SLAY-SHEET.VERCEL.APP ↗
    </text>
  </g>
</svg>
